services:

  spark-master:
    image: apache/spark:3.5.6
    container_name: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
      - "4040:4040"
    volumes:
      - ../data:/data
      - ../src:/opt/spark-apps
    networks:
      - spark-net

  spark-worker-1:
    image: apache/spark:3.5.6
    container_name: spark-worker-1
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
    volumes:
      - ../data:/data
      - ../src:/opt/spark-apps
    networks:
      - spark-net

  spark-worker-2:
    image: apache/spark:3.5.6
    container_name: spark-worker-2
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2G
    volumes:
      - ../data:/data
      - ../src:/opt/spark-apps
    networks:
      - spark-net

networks:
  spark-net:
    driver: bridge